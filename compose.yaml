name: claude-agent-dev

include:
  # service `mitm`; networks `inside` (internal, no route out) and `outside`; volumes `mitm-ca` and `capture`
  - ../Claude.Agent.Network/compose/sidecar.yaml

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-agent:dev
    depends_on:
      mitm:
        condition: service_healthy
      # The keeper must have synced the spool's seq counter to the ledger before the agent writes (design 8).
      ledger:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # From the shell, else from .env. OAuth token is primary, API key the fallback; both empty means probe
      # mode, both set and the agent refuses to start. Never written anywhere by the build.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The image's id (sha256:...), set by the build's Up task, for agent.snapshot's imageDigest; a container
      # cannot read its own. Empty when Compose is run by hand, and imageDigest is then null.
      CLAUDE_AGENT_IMAGE_DIGEST: ${CLAUDE_AGENT_IMAGE_DIGEST:-}
      # A convenience so tools find the proxy; the control is that `inside` has no other way out.
      HTTP_PROXY: http://mitm:8080
      HTTPS_PROXY: http://mitm:8080
      http_proxy: http://mitm:8080
      https_proxy: http://mitm:8080
      NO_PROXY: localhost,127.0.0.1,mitm
      no_proxy: localhost,127.0.0.1,mitm
    networks:
      - inside
    volumes:
      - spool:/spool          # writer side only; the ledger volume and key.bin are never mounted here
      - mitm-ca:/ca:ro
    restart: "no"

  ledger:
    build:
      context: .
      dockerfile: ledger.Dockerfile
    image: claude-agent-ledger:dev
    # The keeper reads and writes files only; with no network at all the agent cannot reach it.
    network_mode: none
    volumes:
      - spool:/spool
      - ledger:/ledger
    stop_grace_period: 15s
    # Host port ${CLAUDE_AGENT_PORT} (default 8300) is reserved for an Alerts/Ledger API when one exists; nothing
    # publishes it yet. Publishing it means giving this service a network instead of network_mode: none (design 9).
    # No service may publish any other host port; Smoke fails if one does and Status if any is published.
    # ports:
    #   - "127.0.0.1:${CLAUDE_AGENT_PORT:-8300}:8300"
    # Healthy once /spool/seq exists: the keeper writes it in its start-up sync when it is missing (lost or new),
    # and it is only ever missing in exactly the case where an early writer would restart seq at 1 (design 8).
    healthcheck:
      test: ["CMD", "test", "-f", "/spool/seq"]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: "no"

volumes:
  spool: {}
  ledger: {}
